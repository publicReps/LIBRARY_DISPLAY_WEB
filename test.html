<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body {
            background-color: red;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* height: 40vh; */
        
        }
        .bodyDiv {
            background-color: rgb(35, 57, 77);
        }
        .bodyHeader {
            background: rgb(31, 132, 172);
            width: 100%;
            height: 160px;
        }
        .bodyWithoutHeader {
            background-color: rgb(106, 150, 133);
            width: 100%;
            /* height: 90vh; */
            height: calc(100vh - 160px);
            /* height: calc(100% - 160px); */
        }
        .bodyTwoPart {
            background-color: rgb(126, 26, 96);
            display: grid;
            grid-template-columns: 250px calc(100% - 250px);
            /* column-gap: 10px; */
            height: 60vh;
            align-self: center;
        }
        .bodyFirstPart {
            background-color: rgb(119, 7, 224);
        }
        .bodySecondPart {
            background-color: beige;
        }
        .bodyEnd {
            background-color: rgb(226, 43, 128);
            height: 15vh;
            align-self: center;
        }
        .gridWithoutHeader {
            display: grid;
            grid-template-rows: 60vh 20vh;
            /* height: 100vh; */
        }
        .FirstHeader, .SecondHeader {
            background-color: rgb(134, 134, 9);
            height: 70px;
            text-align: center;
            font-size: larger;
            /* margin: auto; */
        }
        .firstSection {
            background-color: green;
            /* height: 100%; */
        }
    </style>
</head>
<body>
    <div class="bodyHeader"></div>
    <div class="bodyWithoutHeader gridWithoutHeader">
        <div class="bodyTwoPart">
            <div class="bodyFirstPart">
                <div class="FirstHeader">
                    <section class="firstSection">First Header</section>
                </div>
            </div>
            <div class="bodySecondPart"><div class="SecondHeader">Second Header</div>Second Part</div>
        </div>
        <div class="bodyEnd">This Footer</div>
    </div>
    
</body>
</html>
